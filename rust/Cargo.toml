[package]
name = "token_defense_proxy"
version = "0.1.0"
edition = "2021"
description = "Lossless token defense proxy - strips token waste without changing meaning"
license = "MIT"

[dependencies]
regex = "1"
once_cell = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiktoken-rs = "0.6"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
