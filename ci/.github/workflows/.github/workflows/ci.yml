name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tiktoken pytest

      - name: Run test suite
        run: pytest -q

      - name: Run the demo pipeline
        run: python orchestrator.py

      - name: Run the retrieval demo
        run: python -m retrieval

      - name: Machine-readable report
        run: python orchestrator.py --json

      - name: Stress test - AST must be identical on 300 stdlib files
        run: |
          python - <<'PY'
          import ast, pathlib, random, sys, sysconfig
          from compressors import lossless_code_compressor

          stdlib = pathlib.Path(sysconfig.get_paths()["stdlib"])
          files = [p for p in stdlib.rglob("*.py") if "test" not in p.parts]
          random.seed(7); random.shuffle(files); files = files[:300]

          ok = fail = skip = 0
          before = after = 0
          for f in files:
              try:
                  src = f.read_text(encoding="utf-8")
                  expected = ast.dump(ast.parse(src))
              except Exception:
                  skip += 1; continue
              try:
                  out = lossless_code_compressor(src)
                  if ast.dump(ast.parse(out)) == expected:
                      ok += 1; before += len(src); after += len(out)
                  else:
                      fail += 1; print("AST MISMATCH:", f)
              except Exception as e:
                  fail += 1; print("ERROR:", f, type(e).__name__, e)

          pct = (1 - after / before) * 100 if before else 0
          print(f"AST identical: {ok}  failed: {fail}  skipped: {skip}  ({pct:.1f}% smaller)")
          sys.exit(1 if fail else 0)
          PY

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

      - name: Run the demo binary
        run: cargo run --release

  parity:
    name: Python/Rust parity
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Python deps
        run: pip install tiktoken

      - name: Both implementations must agree on compressed output
        run: python scripts/check_parity.py
