[package]
name = "lossless-token-defense-proxy"
version = "1.0.0"
edition = "2021"
description = "Lossless Token Defense Proxy Engine — ultra-low latency context retrieval optimization"
license = "MIT"
readme = "README.md"
keywords = ["tokens", "retrieval", "pagerank", "pipeline", "tiktoken"]
categories = ["text-processing", "parsing"]
publish = false

[dependencies]
tiktoken-rs = "0.12.0"
regex = "1.10.0"
tree-sitter = "0.20"

[[bin]]
name = "ltdp"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
